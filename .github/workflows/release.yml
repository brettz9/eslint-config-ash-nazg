name: Release

# Triggered by the version tag a maintainer pushes after running
# `pnpm run release` (commit-and-tag-version): it infers the bump from the
# conventional commits since the last tag, bumps package.json, writes the new
# section to CHANGES.md, and makes one local `chore(release)` commit + tag.
# The maintainer then runs `git push --follow-tags origin main`, so the release
# commit and tag go up together and this workflow never commits back to the repo
# (main never gets ahead of a local checkout).
#
# This job only validates and publishes the tagged commit: lint, `npm publish`
# (with provenance via OIDC trusted publishing - no token), and a GitHub
# release whose notes come from the matching CHANGES.md section.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub release
  id-token: write   # OIDC token for npm trusted publishing / provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      # `prepublishOnly` (pnpm tsc && pnpm i) is run automatically by `npm
      # publish` below, so it is not invoked as a separate step here.

      - name: Extract release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$(node -p "require('./package.json').version")" != "$VERSION" ]; then
            echo "::error::package.json version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            const lines = fs.readFileSync("CHANGES.md", "utf8").split("\n");
            // commit-and-tag-version writes "## [x.y.z](compare-url) (date)";
            // also tolerate a plain "## x.y.z" heading.
            const esc = version.replace(/[.]/g, "\\.");
            const head = new RegExp("^## \\[?" + esc + "(\\]|\\s|$)");
            const start = lines.findIndex((l) => head.test(l));
            if (start === -1) {
              console.error("No section for " + version + " in CHANGES.md");
              process.exit(1);
            }
            let end = lines.findIndex((l, i) => i > start && l.startsWith("## "));
            if (end === -1) end = lines.length;
            fs.writeFileSync("/tmp/notes.md", lines.slice(start + 1, end).join("\n").trim() + "\n");
          ' "$VERSION"
          echo "----- release notes -----"
          cat /tmp/notes.md
          echo "-------------------------"
          {
            cat /tmp/notes.md
            echo
            echo "---"
            echo
            echo "📦 npm: [\`eslint-config-ash-nazg@$VERSION\`](https://www.npmjs.com/package/eslint-config-ash-nazg/v/$VERSION)"
          } > /tmp/release-body.md

      - name: Publish to npm
        run: |
          VERSION="${{ steps.notes.outputs.version }}"
          # OIDC trusted publishing needs a recent npm CLI.
          npm install -g npm@latest
          if [ "$(npm view "eslint-config-ash-nazg@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "eslint-config-ash-nazg@$VERSION is already on npm - skipping publish."
          else
            npm publish --provenance --access public
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.notes.outputs.version }}"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "GitHub release v$VERSION already exists."
          else
            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --notes-file /tmp/release-body.md \
              --target main
          fi

name: Release

# Runs on every push to main. It looks at the conventional-commit subjects since
# the last v* tag, infers a patch/minor/major bump, and if anything releasable is
# found it bumps package.json, writes CHANGES.md, tags, publishes to npm (with
# provenance via OIDC trusted publishing - no token), and cuts a GitHub release.
#
# The release commit is made with "[skip ci]" so it does not re-trigger this
# workflow (GitHub skips runs whose head commit message contains that marker).
on:
  push:
    branches: [main]

permissions:
  contents: write   # push the release commit + tag, create the GitHub release
  id-token: write   # OIDC token for npm trusted publishing / provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Plan release
        id: plan
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then
            RANGE="$LAST_TAG..HEAD"
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            # No tag yet: only look at the tip commit so the first automated
            # release stays small and predictable.
            RANGE="HEAD~1..HEAD"
          else
            RANGE="HEAD"
          fi
          echo "range=$RANGE" >> "$GITHUB_OUTPUT"
          echo "Inspecting commits in: $RANGE (since ${LAST_TAG:-repo start})"

          SUBJECTS=$(git log --no-merges --format='%s' "$RANGE" | grep -Fv '[skip ci]' || true)
          BODIES=$(git log --no-merges --format='%B' "$RANGE" || true)

          BUMP=""
          if printf '%s\n' "$BODIES" | grep -qE '^BREAKING[ -]CHANGE:' \
             || printf '%s\n' "$SUBJECTS" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:'; then
            BUMP=major
          elif printf '%s\n' "$SUBJECTS" | grep -qE '^feat(\([^)]*\))?!?:'; then
            BUMP=minor
          elif printf '%s\n' "$SUBJECTS" | grep -qE '^(fix|perf|refactor|revert|chore|docs|build|ci|style|test)(\([^)]*\))?!?:'; then
            BUMP=patch
          fi

          if [ -z "$BUMP" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No releasable conventional commits since ${LAST_TAG:-repo start} - skipping release."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
            echo "::notice::Planning a $BUMP release."
          fi

      - uses: pnpm/action-setup@v4
        if: steps.plan.outputs.release == 'true'
        with:
          version: 11

      - uses: actions/setup-node@v5
        if: steps.plan.outputs.release == 'true'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install
        if: steps.plan.outputs.release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.plan.outputs.release == 'true'
        run: pnpm run lint

      # `prepublishOnly` (pnpm tsc && pnpm i) is run automatically by `npm publish`
      # below, so it is not invoked as a separate step here.

      - name: Bump version
        id: version
        if: steps.plan.outputs.release == 'true'
        run: |
          NEW=$(npm version "${{ steps.plan.outputs.bump }}" --no-git-tag-version)
          NEW=${NEW#v}
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "::notice::New version: $NEW"

      - name: Update CHANGES.md
        if: steps.plan.outputs.release == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git log --no-merges --pretty=format:'%s' "${{ steps.plan.outputs.range }}" \
            | grep -Ev '^(chore: (update CHANGES|release)|[Rr]elease |v?[0-9]+\.[0-9]+\.[0-9]+)' \
            | grep -Fv '[skip ci]' \
            | sed 's/^/- /' > /tmp/notes.md || true
          if [ ! -s /tmp/notes.md ]; then echo "- release: v$VERSION" > /tmp/notes.md; fi
          echo "----- release notes -----"
          cat /tmp/notes.md
          echo "-------------------------"
          node -e '
            const fs = require("fs");
            const [version, notesFile] = process.argv.slice(1);
            const notes = fs.readFileSync(notesFile, "utf8").trimEnd();
            const file = "CHANGES.md";
            const md = fs.readFileSync(file, "utf8");
            const esc = version.replace(/[.]/g, "\\.");
            if (new RegExp("^## " + esc + "\\s*$", "m").test(md)) {
              console.log("CHANGES.md already documents " + version + " - leaving it untouched.");
              process.exit(0);
            }
            const lines = md.split("\n");
            let idx = lines.findIndex((l) => l.startsWith("## "));
            if (idx === -1) idx = lines.length;
            lines.splice(idx, 0, "## " + version, "", notes, "");
            fs.writeFileSync(file, lines.join("\n"));
            console.log("Prepended ## " + version + " section to CHANGES.md.");
          ' "$VERSION" /tmp/notes.md

      - name: Commit, tag and push
        if: steps.plan.outputs.release == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGES.md
          git commit -m "chore: release v$VERSION [skip ci]"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin HEAD:main
          git push origin "refs/tags/v$VERSION"

      - name: Publish to npm
        if: steps.plan.outputs.release == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # OIDC trusted publishing needs a recent npm CLI.
          npm install -g npm@latest
          if [ "$(npm view "eslint-config-ash-nazg@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "eslint-config-ash-nazg@$VERSION is already on npm - skipping publish."
          else
            npm publish --provenance --access public
          fi

      - name: Create GitHub release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "GitHub release v$VERSION already exists."
          else
            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --notes-file /tmp/notes.md \
              --target main
          fi
